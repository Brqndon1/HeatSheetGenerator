<!DOCTYPE html>
<html>
<head>
    <title>Wlecome to Heat Sheet Generator</title>
</head>

<body>
    <h1>Enter your Sheet of Swimmers</h1>
    <h3>Please upload your csv file</h3>

    <form action="http://127.0.0.1:5000/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="csvSheet" accept=".csv">

        <label>Filter by Stroke:</label>
        <select name="stroke">
            <option value="">-- Select Stroke --</option>
            <option value="Freestyle">Freestyle</option>
            <option value="Breaststroke">Breaststroke</option>
            <option value="Backstroke">Backstroke</option>
            <option value="Butterfly">Butterfly</option>
        </select>

        <label>Filter by Age Group:</label>
        <select name="ageGroup">
            <option value="">-- Select Age Group --</option>
            <option value="Girls 8 & Under">Girls 8 & Under</option>
            <option value="Boys 8 & Under">Boys 8 & Under</option>
            <option value="Girls 9-10">Girls 9-10</option>
            <option value="Boys 9-10">Boys 9-10</option>
            <option value="Girls 11-12">Girls 11-12</option>
            <option value="Boys 11-12">Boys 11-12</option>
            <option value="Girls 13-14">Girls 13-14</option>
            <option value="Boys 13-14">Boys 13-14</option>
            <option value="Women 15-18">Women 15-18</option>
            <option value="Men 15-18">Men 15-18</option>
        </select>

        <button type="submit">Upload</button>

    </form>

    <img src="image.png" alt="Swimming Icon">

</body>
</html>
